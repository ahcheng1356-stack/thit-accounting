[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/accounting"
  to = "/.netlify/functions/accounting"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
